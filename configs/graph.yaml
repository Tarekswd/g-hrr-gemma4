system_name: "graph"
model: "gemma-4-31b-it-qat-w4a16-ct"
retrieval:
  enabled: true
  method: "hybrid_bm25_dense"
  top_k: 10
graph:
  enabled: true
  depth: 1
  edge_types: ["calls", "imported_by", "inherits"]
hierarchical_context:
  enabled: false
repair_loop:
  enabled: false
  max_iterations: 1
resource_limits:
  max_tokens: 32000
  max_tool_calls: 25
  timeout_seconds: 900
